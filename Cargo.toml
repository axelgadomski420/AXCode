
[package]
name = "axcode"
version = "1.0.0"
edition = "2021"
authors = ["Axel G"]
description = "Kompletny kompilator jezyka AXCode — deklaratywnego jezyka aplikacji"
license = "MIT"

[[bin]]
name = "axc"
path = "src/main.rs"

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
colored = "2.0"
regex = "1.10"
rayon = "1.8"
anyhow = "1.0"
indexmap = { version = "2.1", features = ["serde"] }

[dev-dependencies]
tempfile = "3.8"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true
